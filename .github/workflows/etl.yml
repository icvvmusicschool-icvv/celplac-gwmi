# Atualização diária dos dados da CELPLAC GWMI (GitHub Actions → Neon).
# Segredo necessário: GWMI_ETL_DATABASE_URL (usuário gwmi_etl, sem -pooler no endereço).
name: Atualização de dados

on:
  schedule:
    - cron: "17 10 * * *"        # todo dia às 07:17 (Brasília)
  workflow_dispatch:
    inputs:
      only:
        description: "Só estes grupos (comex ptax fred macro ibge comtrade), separados por espaço. Vazio = todos"
        required: false
        default: ""
      force:
        description: "Rodar também as fontes semanais/mensais (PEVS, Comtrade) e recalcular tudo"
        type: boolean
        default: false

concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/pyproject.toml

      - name: Instalar o ETL
        run: pip install ./core ./etl

      - name: Atualizar
        env:
          DATABASE_URL: ${{ secrets.GWMI_ETL_DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GWMI_RAW_DIR: raw
          GWMI_RAW_ARCHIVE: "github-actions:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GWMI_ONLY: ${{ inputs.only }}
          GWMI_FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Segredo GWMI_ETL_DATABASE_URL não configurado"; exit 1; fi
          gwmi-etl update

      - name: Guardar os arquivos originais (90 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw/
          retention-days: 90
          if-no-files-found: ignore
