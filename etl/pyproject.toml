[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwmi-etl"
version = "0.2.0"
description = "CELPLAC GWMI — ETL (Comex Stat, BCB, IBGE, FRED, Comtrade, FAOSTAT, CSV manual, DEMO)"
requires-python = ">=3.11"
dependencies = [
  "gwmi-core",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gwmi-etl = "gwmi_etl.cli:main"

[tool.setuptools.packages.find]
include = ["gwmi_etl*"]

[tool.setuptools.package-data]
gwmi_etl = ["demo_data/*.jsonl"]
